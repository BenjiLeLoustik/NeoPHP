name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          git fetch --tags
          echo "TAG=$(git describe --tags --abbrev=0 || echo v0.0.0)" >> $GITHUB_OUTPUT

      - name: Compute version bump (PHP)
        id: version
        run: |
          php -r "
          \$tag = '${{ steps.tag.outputs.TAG }}';

          \$raw = shell_exec('git log ' . \$tag . '..HEAD --pretty=%s');
          \$commits = array_filter(explode(PHP_EOL, trim(\$raw)));

          preg_match('/v(\d+)\.(\d+)\.(\d+)/', \$tag, \$m);

          \$major = (int)\$m[1];
          \$minor = (int)\$m[2];
          \$patch = (int)\$m[3];

          \$hasBreaking = false;
          \$hasFeature = false;
          \$hasFix = false;

          foreach (\$commits as \$msg) {

              if (preg_match('/!:/', \$msg) || str_contains(\$msg, 'BREAKING')) {
                  \$hasBreaking = true;
                  break;
              }

              if (preg_match('/^(docs|chore|style)(\(.+\))?:/', \$msg)) {
                  continue;
              }

              if (preg_match('/^feat(\(.+\))?:/', \$msg)) {
                  \$hasFeature = true;
              }

              if (preg_match('/^fix(\(.+\))?:/', \$msg)) {
                  \$hasFix = true;
              }
          }

          if (\$hasBreaking) {
              \$major++;
              \$minor = 0;
              \$patch = 0;

          } elseif (\$hasFeature) {
              \$minor++;
              \$patch = 0;

          } elseif (\$hasFix) {
              \$patch++;

          } else {
              \$patch++;
          }

          \$new = \"v{\$major}.{\$minor}.{\$patch}\";

          echo \$new;
          file_put_contents('version.txt', \$new);
          "

          echo "VERSION=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: |
          git log ${{ steps.tag.outputs.TAG }}..HEAD --pretty=format:"- %s (%h)" > CHANGELOG.md

      - name: Create Git tag
        if: ${{ steps.tag.outputs.TAG != steps.version.outputs.VERSION }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag ${{ steps.version.outputs.VERSION }} || true
          git push origin ${{ steps.version.outputs.VERSION }} || true

      - name: Create GitHub Release
        if: ${{ steps.tag.outputs.TAG != steps.version.outputs.VERSION }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          generate_release_notes: true