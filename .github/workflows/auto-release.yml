name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          git fetch --tags
          echo "TAG=$(git describe --tags --abbrev=0 || echo v0.0.0)" >> $GITHUB_OUTPUT

      - name: Compute version bump (PHP)
        id: version
        run: |
          php <<'PHP'
          <?php

          $tag = '${{ steps.tag.outputs.TAG }}';

          $raw = shell_exec('git log ' . $tag . '..HEAD --pretty=%s');
          $commits = array_filter(explode(PHP_EOL, trim($raw)));

          preg_match('/v(\d+)\.(\d+)\.(\d+)/', $tag, $m);

          $major = (int) $m[1];
          $minor = (int) $m[2];
          $patch = (int) $m[3];

          $hasBreaking = false;
          $hasFeature = false;
          $hasFix = false;

          foreach ($commits as $msg) {

              if (preg_match('/!:/', $msg) || str_contains($msg, 'BREAKING')) {
                  $hasBreaking = true;
                  break;
              }

              if (preg_match('/^(docs|chore|style)(\(.+\))?:/', $msg)) {
                  continue;
              }

              if (preg_match('/^feat(\(.+\))?:/', $msg)) {
                  $hasFeature = true;
              }

              if (preg_match('/^fix(\(.+\))?:/', $msg)) {
                  $hasFix = true;
              }
          }

          if ($hasBreaking) {
              $major++;
              $minor = 0;
              $patch = 0;
          } elseif ($hasFeature) {
              $minor++;
              $patch = 0;
          } elseif ($hasFix) {
              $patch++;
          } else {
              $patch++;
          }

          $new = "v{$major}.{$minor}.{$patch}";

          file_put_contents('VERSION', ltrim($new, 'v'));

          file_put_contents(
            getenv('GITHUB_OUTPUT'),
            "VERSION=$new" . PHP_EOL,
            FILE_APPEND
          );

          echo $new;
          PHP

      - name: Generate changelog
        if: ${{ steps.tag.outputs.TAG != steps.version.outputs.VERSION }}
        run: |
          touch CHANGELOG.md

          {
            echo "${{ steps.version.outputs.VERSION }}"
            git log ${{ steps.tag.outputs.TAG }}..HEAD --pretty=format:"- %s (%h)"
          } > CHANGELOG_ENTRY.md

          {
            cat CHANGELOG_ENTRY.md
            echo ""
            echo ""
            cat CHANGELOG.md
          } > CHANGELOG.tmp.md
          mv CHANGELOG.tmp.md CHANGELOG.md

      - name: Commit generated files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add VERSION CHANGELOG.md
          git commit -m "chore(release): update version and changelog" || true
          git push 

      - name: Create Git tag
        if: ${{ steps.tag.outputs.TAG != steps.version.outputs.VERSION }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          
          git fetch origin main
          git checkout main
          git pull origin main
          
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        if: ${{ steps.tag.outputs.TAG != steps.version.outputs.VERSION }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG_ENTRY.md
          generate_release_notes: true